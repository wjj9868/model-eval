<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>评测高风险样本观测台</title>
<style>
  :root {
    color-scheme: light;
    --surface: #f7f7f8;
    --surface-card: #ffffff;
    --surface-muted: #efeff2;
    --text: #171717;
    --text-muted: #52525b;
    --border: rgba(23, 23, 23, 0.12);
    --brand: #4b3fe3;
    --brand-soft: #f2f7ff;
    --brand-text: #1a1759;
    --amber: #efaa17;
    --amber-soft: #fff7e6;
    --red: #e8463a;
    --red-soft: #fdf0ef;
    --blue: #2563eb;
    --blue-soft: #eff6ff;
    --green: #1dc981;
    --green-soft: #eafbf2;
    --radius: 8px;
    --radius-card: 12px;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #131316;
    --surface-card: #1b1b1f;
    --surface-muted: #26262b;
    --text: #e5e5e9;
    --text-muted: #a1a1aa;
    --border: rgba(229, 229, 229, 0.14);
    --brand: #6054f1;
    --brand-soft: #1a1759;
    --brand-text: #cfd8ff;
    --amber: #f0b429;
    --amber-soft: #2a2410;
    --red: #f0564a;
    --red-soft: #2a1512;
    --blue: #60a5fa;
    --blue-soft: #0f1e33;
    --green: #34d399;
    --green-soft: #0f2b1e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--surface);
    color: var(--text);
    font: 400 14px/20px var(--sans);
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font: 600 16px/24px var(--sans); }
  header .sub { color: var(--text-muted); font-size: 12px; line-height: 18px; font-weight: 400; }
  .spacer { flex: 1; }
  .upload-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--brand); color: #fff; border: none;
    border-radius: var(--radius-full); padding: 8px 16px;
    font: 500 13px/18px var(--sans); cursor: pointer;
  }
  .upload-btn:hover { opacity: .92; }
  .theme-btn {
    background: var(--surface-muted); color: var(--text-muted);
    border: 1px solid var(--border); border-radius: var(--radius-full);
    padding: 8px 12px; font: 500 13px/18px var(--sans); cursor: pointer;
  }
  .theme-btn:hover { color: var(--text); }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 24px 60px; }
  /* 空态 */
  .dropzone {
    border: 2px dashed var(--border); border-radius: var(--radius-card);
    padding: 64px 24px; text-align: center; color: var(--text-muted);
    background: var(--surface-card); margin-top: 8px;
  }
  .dropzone.drag { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-text); }
  .dropzone .big { font: 500 16px/24px var(--sans); margin-bottom: 8px; }
  /* 统计 + 过滤 */
  .stats {
    display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
  }
  .stat {
    background: var(--surface-card); border: 1px solid var(--border);
    border-radius: var(--radius-card); padding: 12px 16px; min-width: 110px;
  }
  .stat .k { font-size: 12px; line-height: 18px; color: var(--text-muted); }
  .stat .v { font: 600 18px/26px var(--mono); margin-top: 2px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .f-btn {
    border: 1px solid var(--border); background: var(--surface-card); color: var(--text-muted);
    border-radius: var(--radius-full); padding: 6px 14px; font: 500 13px/18px var(--sans);
    cursor: pointer; transition: all .12s ease;
  }
  .f-btn.active { border-color: var(--brand); color: var(--brand-text); background: var(--brand-soft); }
  .search {
    flex: 1 1 200px; display: flex; gap: 8px;
    border: 1px solid var(--border); background: var(--surface-card);
    border-radius: var(--radius-full); padding: 6px 14px; align-items: center;
  }
  .search input {
    flex: 1; border: none; background: none; outline: none;
    color: var(--text); font: 400 13px/18px var(--sans); min-width: 0;
  }
  /* 样本卡片 */
  .card {
    background: var(--surface-card); border: 1px solid var(--border);
    border-radius: var(--radius-card); margin-bottom: 14px; overflow: hidden;
  }
  .card-head {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  .sid { font: 600 14px/20px var(--mono); }
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    border-radius: var(--radius-full); padding: 2px 10px;
    font: 500 12px/18px var(--sans);
  }
  .tag-json { background: var(--red-soft); color: var(--red); }
  .tag-intent { background: var(--amber-soft); color: var(--amber); }
  .tag-trunc { background: var(--blue-soft); color: var(--blue); }
  .head-scores { margin-left: auto; display: flex; gap: 16px; flex-wrap: wrap; }
  .head-score { text-align: right; }
  .head-score .hk { font-size: 11px; line-height: 16px; color: var(--text-muted); }
  .head-score .hv { font: 600 14px/20px var(--mono); }
  .head-score .hv.bad { color: var(--red); }
  .head-score .hv.warn { color: var(--amber); }
  .card-body { padding: 14px 16px; }
  /* checks */
  .checks {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .check-item {
    font: 500 12px/18px var(--mono); border-radius: var(--radius);
    padding: 4px 10px; border: 1px solid var(--border); color: var(--text-muted);
  }
  .check-item.ok { color: var(--green); border-color: var(--green); background: var(--green-soft); }
  .check-item.fail { color: var(--red); border-color: var(--red); background: var(--red-soft); }
  /* prompt */
  .prompt-block {
    background: var(--surface-muted); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px;
    font: 400 12px/18px var(--mono); color: var(--text-muted);
    white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow: hidden;
    position: relative;
  }
  .prompt-block.expanded { max-height: none; }
  .prompt-toggle {
    position: absolute; right: 8px; bottom: 6px;
    background: var(--surface-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 2px 8px;
    font: 500 11px/16px var(--sans); color: var(--text-muted); cursor: pointer;
  }
  /* teacher / student 对照 */
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pair-col { min-width: 0; }
  .pair-title {
    display: flex; align-items: center; gap: 8px;
    font: 500 13px/18px var(--sans); margin-bottom: 8px;
  }
  .pill { border-radius: var(--radius-full); padding: 1px 10px; font: 500 12px/18px var(--sans); }
  .pill-teacher { background: var(--brand-soft); color: var(--brand-text); }
  .pill-student { background: var(--surface-muted); color: var(--text-muted); border: 1px solid var(--border); }
  .copy-btn {
    margin-left: auto; display: inline-flex; align-items: center; gap: 4px;
    background: var(--surface-card); border: 1px solid var(--border); color: var(--text-muted);
    border-radius: var(--radius); padding: 2px 10px; cursor: pointer;
    font: 500 11px/16px var(--sans); user-select: none;
  }
  .copy-btn:hover { border-color: var(--brand); color: var(--brand-text); }
  .copy-btn.copied { border-color: var(--green); color: var(--green); }
  pre.json {
    background: var(--surface-muted); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 12px;
    font: 400 12px/18px var(--mono);
    white-space: pre-wrap; word-break: break-all;
    max-height: 320px; overflow: auto;
  }
  /* JSON 高亮类 */
  .jk { color: var(--brand); }
  .jstr { color: var(--green); }
  .jnum { color: var(--amber); }
  .jbool { color: var(--blue); }
  .jnull { color: var(--text-muted); font-style: italic; }
  .empty { text-align: center; color: var(--text-muted); padding: 32px 0; }
  /* 分页 */
  .pager {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin: 14px 0; flex-wrap: wrap;
  }
  .pager:empty { display: none; }
  .p-btn {
    border: 1px solid var(--border); background: var(--surface-card); color: var(--text);
    border-radius: var(--radius); padding: 6px 16px; font: 500 13px/18px var(--sans);
    cursor: pointer; min-width: 64px;
  }
  .p-btn:hover:not(:disabled) { border-color: var(--brand); color: var(--brand-text); }
  .p-btn:disabled { opacity: .4; cursor: not-allowed; }
  .page-info { font: 500 13px/18px var(--mono); color: var(--text-muted); }
  .page-size { font: 500 12px/18px var(--sans); color: var(--text-muted); }
  footer { padding: 16px 24px; color: var(--text-muted); font-size: 12px; text-align: center; }
  @media (max-width: 760px) { .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>评测高风险样本观测台</h1>
    <div class="sub">加载 run_real_eval.py --dump-observations 生成的 JSONL 文件</div>
  </div>
  <div class="spacer"></div>
  <button class="upload-btn" id="pickBtn">选择 JSONL 文件</button>
  <button class="theme-btn" id="themeBtn">切换深色</button>
  <input type="file" id="fileInput" accept=".jsonl,.ndjson,.json" hidden>
</header>

<main>
  <div class="dropzone" id="dropzone">
    <div class="big">拖拽 JSONL 文件到这里，或点击右上角「选择文件」</div>
    <div>支持 run_real_eval.py --dump-observations 的输出格式</div>
  </div>

  <div id="content" hidden>
    <div class="stats">
      <div class="stat"><div class="k">高风险样本</div><div class="v" id="stTotal">–</div></div>
      <div class="stat"><div class="k" style="color:var(--red)">json_valid&lt;1</div><div class="v" id="stJson">–</div></div>
      <div class="stat"><div class="k" style="color:var(--amber)">intent&lt;0.6</div><div class="v" id="stIntent">–</div></div>
      <div class="stat"><div class="k" style="color:var(--blue)">截断</div><div class="v" id="stTrunc">–</div></div>
      <div class="stat"><div class="k">当前显示</div><div class="v" id="stShow">–</div></div>
    </div>
    <div class="filters">
      <button class="f-btn active" data-why="all">全部</button>
      <button class="f-btn" data-why="json_invalid">json 不合格</button>
      <button class="f-btn" data-why="intent_low">intent 低分</button>
      <button class="f-btn" data-why="truncated">截断</button>
      <div class="search">
        <span id="searchGlyph" style="color:var(--text-muted)">⌕</span>
        <input id="searchInput" placeholder="搜索 sample_id 或输出内容关键词…">
      </div>
    </div>
    <div class="pager" id="pager"></div>
    <div id="cards"></div>
    <div class="pager" id="pagerBottom"></div>
    <div class="empty" id="emptyBox" hidden>没有匹配的样本</div>
  </div>
</main>

<footer>本地浏览器解析，页面无任何网络请求，数据不出本机；用毕请勿留存敏感文件</footer>

<script>
(function () {
  "use strict";
  var data = [];
  var activeWhy = "all";
  var page = 0;
  var PAGE_SIZE = 20;
  var themeBtn = document.getElementById("themeBtn");
  var fileInput = document.getElementById("fileInput");
  var dropzone = document.getElementById("dropzone");
  var content = document.getElementById("content");
  var cardsEl = document.getElementById("cards");
  var emptyBox = document.getElementById("emptyBox");
  var searchInput = document.getElementById("searchInput");
  var pagerEl = document.getElementById("pager");
  var pagerBottomEl = document.getElementById("pagerBottom");
  var perPageEl = null;

  // 主题持久化
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("obs-viewer-theme", t); } catch (e) {}
  }
  var saved = null;
  try { saved = localStorage.getItem("obs-viewer-theme"); } catch (e) {}
  applyTheme(saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  themeBtn.addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    applyTheme(cur === "dark" ? "light" : "dark");
  });

  function fmtScore(v) { return v === null || v === undefined ? "N/A" : v.toFixed(4); }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // 简易 JSON 语法高亮（字符串/数字/布尔/null/键），转义安全的顺序渲染
  function highlightJson(raw) {
    var text = typeof raw === "string" ? raw : String(raw);
    var out = "";
    var i = 0, n = text.length;
    while (i < n) {
      var ch = text[i];
      if (ch === '"') {
        // 字符串：尝试判断是否为键（后置冒号）
        var end = i + 1; var frag = "";
        while (end < n && text[end] !== '"') {
          if (text[end] === "\\" && end + 1 < n) { frag += text.slice(end, end + 2); end += 2; continue; }
          frag += text[end]; end++;
        }
        var str = text.slice(i, end + 1);
        var after = text.slice(end + 1, end + 2);
        var cls = after === ":" ? "jk" : "jstr";
        out += '<span class="' + cls + '">' + esc(str) + "</span>";
        i = end + 1;
      } else if (/[0-9.\-]/.test(ch)) {
        var m = /^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?/.exec(text.slice(i));
        if (m) { out += '<span class="jnum">' + esc(m[0]) + "</span>"; i += m[0].length; }
        else { out += esc(ch); i++; }
      } else if (text.startsWith("true", i) || text.startsWith("false", i) || text.startsWith("null", i)) {
        var word = /^(true|false|null)/.exec(text.slice(i));
        if (word) {
          var cls = word[0] === "null" ? "jnull" : "jbool";
          out += '<span class="' + cls + '">' + word[0] + "</span>";
          i += word[0].length;
        } else { out += esc(ch); i++; }
      } else {
        out += esc(ch); i++;
      }
    }
    return out;
  }

  function scoreBadClass(scores) {
    if (scores && scores.json_valid !== undefined && scores.json_valid < 1) return "bad";
    return "";
  }

  function renderChecks(checks) {
    if (!checks || !Object.keys(checks).length) return "";
    var order = ["parseable", "fields_complete", "memory_categories_valid", "rolling_summary_length_ok", "memory_no_duplicates"];
    var labels = {
      parseable: "可解析", fields_complete: "字段齐全", memory_categories_valid: "分类合法",
      rolling_summary_length_ok: "摘要长度", memory_no_duplicates: "无重复条目"
    };
    var html = '<div class="checks">';
    order.forEach(function (k) {
      if (!(k in checks)) return;
      var ok = checks[k];
      html += '<span class="check-item ' + (ok ? "ok" : "fail") + '">' + (ok ? "✓ " : "✗ ") + esc(labels[k] || k) + "</span>";
    });
    return html + "</div>";
  }

  function renderPrompt(excerpt) {
    if (!excerpt) return "";
    return '<div class="prompt-block"><span class="prompt-toggle">展开/收起</span>' + esc(excerpt) + "</div>";
  }

  function tagHtml(why) {
    var m = { json_invalid: ["tag-json", "JSON 不合格"], intent_low: ["tag-intent", "intent 低分"], truncated: ["tag-trunc", "截断"] };
    return why.map(function (w) { var t = m[w] || ["tag-intent", w]; return '<span class="tag ' + t[0] + '">' + t[1] + "</span>"; }).join("");
  }

  function renderCard(row) {
    var s = row.scores || {};
    var why = row.why || [];
    var sid = row.sample_id;
    // 优先展示原始输出（截断样本 student 为空但 student_raw 有截断前全文）
    var studentView = row.student_raw !== undefined ? row.student_raw : row.student;
    return (
      '<div class="card" data-id="' + sid + '">' +
        '<div class="card-head">' +
          '<span class="sid">#' + row.sample_id + "</span>" +
          tagHtml(why) +
          '<div class="head-scores">' +
            '<div class="head-score"><div class="hk">total</div><div class="hv">' + fmtScore(s.total_score) + "</div></div>" +
            '<div class="head-score"><div class="hk ' + (s.json_valid < 1 ? "bad" : "") + '">json</div><div class="hv ' + (s.json_valid < 1 ? "bad" : "") + '">' + fmtScore(s.json_valid) + "</div></div>" +
            '<div class="head-score"><div class="hk ' + (s.intent_score !== undefined && s.intent_score < 0.6 ? "warn" : "") + '">intent</div><div class="hv ' + (s.intent_score !== undefined && s.intent_score < 0.6 ? "warn" : "") + '">' + fmtScore(s.intent_score) + "</div></div>" +
            '<div class="head-score"><div class="hk">finish</div><div class="hv">' + esc(row.finish_reason || "stop") + "</div></div>" +
          "</div>" +
        "</div>" +
        '<div class="card-body">' +
          renderChecks(row.checks) +
          renderPrompt(row.prompt_excerpt) +
          '<div class="pair">' +
            '<div class="pair-col">' +
              '<div class="pair-title"><span class="pill pill-teacher">teacher</span>' +
              '<button class="copy-btn" data-sid="' + sid + '" data-which="teacher">复制</button></div>' +
              '<pre class="json">' + highlightJson(row.teacher) + "</pre>" +
            "</div>" +
            '<div class="pair-col">' +
              '<div class="pair-title"><span class="pill pill-student">student</span>' +
              '<button class="copy-btn" data-sid="' + sid + '" data-which="student">复制</button></div>' +
              '<pre class="json">' + highlightJson(studentView) + "</pre>" +
            "</div>" +
          "</div>" +
        "</div>" +
      "</div>"
    );
  }

  function filtered() {
    var kw = searchInput.value.trim().toLowerCase();
    return data.filter(function (row) {
      if (activeWhy !== "all" && (row.why || []).indexOf(activeWhy) === -1) return false;
      if (!kw) return true;
      if (String(row.sample_id).indexOf(kw) !== -1) return true;
      if ((row.student || "").toLowerCase().indexOf(kw) !== -1) return true;
      if ((row.teacher || "").toLowerCase().indexOf(kw) !== -1) return true;
      return false;
    });
  }

  function copyText(text, btn) {
    function done() {
      btn.classList.add("copied");
      var old = btn.textContent;
      btn.textContent = "已复制 ✓";
      setTimeout(function () { btn.classList.remove("copied"); btn.textContent = old; }, 1500);
    }
    function legacyCopy() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(function () { legacyCopy(); done(); });
    } else { legacyCopy(); done(); }
  }

  function bindCopyButtons() {
    Array.prototype.forEach.call(document.querySelectorAll(".copy-btn"), function (btn) {
      btn.addEventListener("click", function () {
        var sid = parseInt(btn.getAttribute("data-sid"), 10);
        var which = btn.getAttribute("data-which");
        var row = null;
        for (var i = 0; i < data.length; i++) { if (data[i].sample_id === sid) { row = data[i]; break; } }
        if (!row || !row[which]) return;
        copyText(row[which], btn);
      });
    });
  }

  function renderPager(total, container) {
    var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (page >= pages) page = pages - 1;
    var html =
      '<span class="page-size">每页 ' + PAGE_SIZE + ' 条</span>' +
      '<button class="p-btn" data-dir="-1"' + (page === 0 ? " disabled" : "") + '>‹ 上一页</button>' +
      '<span class="page-info">' + (total === 0 ? "0" : (page + 1) + " / " + pages) + "</span>" +
      '<button class="p-btn" data-dir="1"' + (page >= pages - 1 ? " disabled" : "") + '>下一页 ›</button>' +
      '<span class="page-size">共 ' + total + " 条</span>";
    container.innerHTML = html;
    container.querySelectorAll(".p-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (btn.disabled) return;
        page += parseInt(btn.getAttribute("data-dir"), 10);
        render();
      });
    });
  }

  function render() {
    var rows = filtered();
    var pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    if (page >= pages) page = pages - 1;
    if (page < 0) page = 0;
    var slice = rows.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
    cardsEl.innerHTML = slice.map(renderCard).join("");
    emptyBox.hidden = rows.length !== 0;
    // 展开/收起 prompt
    Array.prototype.forEach.call(cardsEl.querySelectorAll(".prompt-block"), function (blk) {
      var btn = blk.querySelector(".prompt-toggle");
      btn.addEventListener("click", function () { blk.classList.toggle("expanded"); });
    });
    bindCopyButtons();
    document.getElementById("stShow").textContent = rows.length + " / " + data.length;
    document.getElementById("stTotal").textContent = data.length;
    document.getElementById("stJson").textContent = data.filter(function (r) { return (r.why || []).indexOf("json_invalid") !== -1; }).length;
    document.getElementById("stIntent").textContent = data.filter(function (r) { return (r.why || []).indexOf("intent_low") !== -1; }).length;
    document.getElementById("stTrunc").textContent = data.filter(function (r) { return (r.why || []).indexOf("truncated") !== -1; }).length;
    renderPager(rows.length, pagerEl);
    renderPager(rows.length, pagerBottomEl);
  }

  function loadFile(file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      data = [];
      var text = String(e.target.result);
      var lines = text.split("\n");
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;
        try { data.push(JSON.parse(line)); } catch (err) { console.warn("跳过不可解析行", i + 1, err); }
      }
      dropzone.hidden = true;
      content.hidden = false;
      render();
    };
    reader.onerror = function () { alert("文件读取失败"); };
    reader.readAsText(file, "utf-8");
  }

  // 事件绑定
  document.getElementById("pickBtn").addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function () { if (fileInput.files[0]) loadFile(fileInput.files[0]); });
  dropzone.addEventListener("dragover", function (e) { e.preventDefault(); dropzone.classList.add("drag"); });
  dropzone.addEventListener("dragleave", function () { dropzone.classList.remove("drag"); });
  dropzone.addEventListener("drop", function (e) {
    e.preventDefault(); dropzone.classList.remove("drag");
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".f-btn"), function (btn) {
    btn.addEventListener("click", function () {
      activeWhy = btn.getAttribute("data-why");
      page = 0;
      Array.prototype.forEach.call(document.querySelectorAll(".f-btn"), function (b) { b.classList.toggle("active", b === btn); });
      render();
    });
  });
  searchInput.addEventListener("input", function () { page = 0; render(); });
})();
</script>
</body>
</html>
